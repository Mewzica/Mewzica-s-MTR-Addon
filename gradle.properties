# 构建配置 - Mewzica's MTR Addon
minecraftVersion=1.20.1
version=0.0.1-dev

# Fabric 版本（与 MTR 4.0.5 对应）
yarnVersion=1.20.1+build.10
fabricLoaderVersion=0.16.10
fabricApiVersion=0.92.2+1.20.1

# 本地依赖 jar 目录（MTR 的发布 jar 需自行放入，见 README）
mtrJar=libs/MTR-fabric-4.0.5+1.20.1.jar

org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.daemon=false

# 本机代理不写在这里 —— 写进项目会提交到 Git，别人的构建会去连一个不存在的代理。
# 需要代理的话，写到 GRADLE_USER_HOME/gradle.properties（项目之外，不会被提交）：
#   systemProp.http.proxyHost=127.0.0.1
#   systemProp.http.proxyPort=10808
#   systemProp.https.proxyHost=127.0.0.1
#   systemProp.https.proxyPort=10808
