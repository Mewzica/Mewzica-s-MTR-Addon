# 构建配置 - Mewzica's MTR Addon
minecraftVersion=1.20.1
version=0.0.1-dev

# Fabric 版本（与 MTR 4.0.5 对应）
yarnVersion=1.20.1+build.10
fabricLoaderVersion=0.16.10
fabricApiVersion=0.92.2+1.20.1

# 本地依赖 jar 目录（MTR 的发布 jar 需自行放入，见 README）
mtrJar=libs/MTR-fabric-4.0.5+1.20.1.jar

# 构建前置：上面这个 jar 缺失时，build.gradle 会自动从下面这个地址下载并校验 SHA-1。
# 换 MTR 版本时三处一起改：mtrJar、mtrDownloadUrl、mtrSha1
# （地址从 Modrinth 的 version API 取：files[].url / files[].hashes.sha1）
mtrDownloadUrl=https://cdn.modrinth.com/data/XKPAmI6u/versions/5cxaj3g8/MTR-fabric-4.0.5%2B1.20.1.jar
mtrSha1=0b5c3b981418e092bfb0aa3f7414110be1c61040

org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.daemon=false

# 本机代理不写在这里 —— 写进项目会提交到 Git，别人的构建会去连一个不存在的代理。
# 需要代理的话，写到 GRADLE_USER_HOME/gradle.properties（项目之外，不会被提交），
# 键名是 systemProp.http.proxyHost / systemProp.http.proxyPort（https 同理）。
