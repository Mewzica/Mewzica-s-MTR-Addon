<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>手动驾驶 HUD · 布局编辑器</title>
<style>
  :root{
    --bg:#0d0d0f; --panel:#17181b; --panel2:#1e2024; --line:#2b2e33;
    --fg:#e6e8eb; --fg2:#9aa0a6; --accent:#4c9aff; --danger:#ff5c5c;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font:13px/1.5 "Microsoft YaHei","PingFang SC","Noto Sans SC",system-ui,sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
  }
  header{
    flex:0 0 auto; padding:10px 16px; border-bottom:1px solid var(--line);
    display:flex; align-items:baseline; gap:12px; background:var(--panel);
  }
  header h1{font-size:15px; margin:0; font-weight:600}
  header .sub{font-size:12px; color:var(--fg2)}
  header .spacer{flex:1}
  header button{
    background:var(--panel2); color:var(--fg); border:1px solid var(--line);
    border-radius:5px; padding:5px 12px; font-size:12px; cursor:pointer;
  }
  header button:hover{border-color:var(--accent); color:#fff}
  header button.primary{background:var(--accent); border-color:var(--accent); color:#fff}

  main{flex:1; display:flex; min-height:0}

  .stage{flex:1; display:flex; flex-direction:column; min-width:0; min-height:0}
  .stage-bar{
    flex:0 0 auto; padding:6px 12px; font-size:12px; color:var(--fg2);
    border-bottom:1px solid var(--line); display:flex; gap:14px; align-items:center; flex-wrap:wrap;
  }
  .stage-bar label{display:flex; align-items:center; gap:5px}
  .stage-bar input[type=number]{
    width:66px; background:#0b0c0e; color:var(--fg); border:1px solid var(--line);
    border-radius:4px; padding:3px 6px; font-size:12px;
  }
  .stage-bar input[type=checkbox]{accent-color:var(--accent); cursor:pointer}
  .stage-bar .spacer{flex:1}
  .stage-bar b{color:var(--fg); font-weight:600}
  .stage-view{
    flex:1; overflow:auto; display:flex; align-items:center; justify-content:center;
    padding:18px; background:
      linear-gradient(45deg,#131417 25%,transparent 25%,transparent 75%,#131417 75%),
      linear-gradient(45deg,#131417 25%,#0f1013 25%,#0f1013 75%,#131417 75%);
    background-size:20px 20px; background-position:0 0,10px 10px;
  }
  canvas#cv{display:block; box-shadow:0 8px 40px rgba(0,0,0,.6); border-radius:3px; cursor:default; touch-action:none}

  .side{
    flex:0 0 324px; width:324px; border-left:1px solid var(--line);
    background:var(--panel); overflow-y:auto; padding:0 0 40px;
  }
  .side::-webkit-scrollbar{width:10px}
  .side::-webkit-scrollbar-thumb{background:#333; border-radius:5px}
  .group{border-bottom:1px solid var(--line)}
  .group>h3{
    margin:0; padding:9px 14px; font-size:12px; font-weight:600; letter-spacing:.4px;
    color:var(--fg); cursor:pointer; user-select:none; background:var(--panel2);
    display:flex; align-items:center; gap:8px;
  }
  .group>h3::before{content:"\25BE"; font-size:10px; color:var(--fg2); transition:transform .15s}
  .group.collapsed>h3::before{transform:rotate(-90deg)}
  .group.collapsed>.group-body{display:none}
  .group-body{padding:8px 14px 12px}

  .palette{display:grid; grid-template-columns:1fr 1fr; gap:6px}
  .palette button{
    background:var(--panel2); color:var(--fg); border:1px solid var(--line);
    border-radius:5px; padding:7px 6px; font-size:12px; cursor:pointer; text-align:left;
  }
  .palette button:hover{border-color:var(--accent); color:#fff}

  .wlist{display:flex; flex-direction:column; gap:3px}
  .wrow{
    display:flex; align-items:center; gap:6px; padding:4px 6px; border-radius:5px;
    border:1px solid transparent; cursor:pointer; font-size:12px;
  }
  .wrow:hover{background:var(--panel2)}
  .wrow.sel{background:#1b2a3f; border-color:var(--accent)}
  .wrow .nm{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .wrow .tag{font-size:10px; color:var(--fg2); font-variant-numeric:tabular-nums}
  .wrow button{background:none; border:0; color:var(--fg2); cursor:pointer; font-size:12px; padding:0 3px}
  .wrow button:hover{color:#fff}
  .wrow button.del:hover{color:var(--danger)}

  .ctrl{display:grid; grid-template-columns:1fr auto; align-items:center; gap:4px 8px; padding:4px 0}
  .ctrl>.ctrl-name{font-size:12px; color:var(--fg2)}
  .ctrl input[type=text],.ctrl input[type=number],.ctrl select{
    width:100%; background:#0b0c0e; color:var(--fg); border:1px solid var(--line);
    border-radius:4px; padding:3px 6px; font-size:12px;
  }
  .ctrl input[type=number]{width:72px}
  .ctrl input[type=color]{
    width:38px; height:20px; padding:0; border:1px solid var(--line);
    border-radius:3px; background:none; cursor:pointer;
  }
  .ctrl input[type=checkbox]{accent-color:var(--accent); cursor:pointer; margin:0}
  .hint{font-size:11px; color:var(--fg2); padding:2px 0 6px; line-height:1.6}
  .kv{display:flex; gap:6px}
  .kv>div{flex:1; display:flex; align-items:center; gap:5px}
  .kv>div>span{font-size:11px; color:var(--fg2)}
  .btns{display:flex; gap:6px; margin-top:8px}
  .btns button{
    flex:1; background:var(--panel2); color:var(--fg); border:1px solid var(--line);
    border-radius:5px; padding:6px; font-size:12px; cursor:pointer;
  }
  .btns button:hover{border-color:var(--accent); color:#fff}
  .btns button.danger:hover{border-color:var(--danger); color:var(--danger)}

  .modal{
    position:fixed; inset:0; background:rgba(0,0,0,.65); display:none;
    align-items:center; justify-content:center; padding:32px; z-index:50;
  }
  .modal.show{display:flex}
  .modal-box{
    background:var(--panel); border:1px solid var(--line); border-radius:8px;
    width:min(800px,100%); max-height:100%; display:flex; flex-direction:column; overflow:hidden;
  }
  .modal-box header{border-bottom:1px solid var(--line); background:none}
  .modal-box textarea{
    flex:1; min-height:360px; margin:0; padding:14px 16px; border:0; resize:vertical;
    background:#0b0c0e; color:#cfe3ff; font:12px/1.6 Consolas,"Courier New",monospace;
    outline:none; white-space:pre; overflow:auto;
  }
  .modal-box footer{padding:10px 16px; border-top:1px solid var(--line); display:flex; gap:8px; justify-content:flex-end}
  .modal-box footer button{
    background:var(--panel2); color:var(--fg); border:1px solid var(--line);
    border-radius:5px; padding:6px 14px; font-size:12px; cursor:pointer;
  }
  .modal-box footer button.primary{background:var(--accent); border-color:var(--accent); color:#fff}
</style>
</head>
<body>

<header>
  <h1>手动驾驶 HUD · 布局编辑器</h1>
  <span class="sub">拖动控件改位置 · Delete 删除 · 方向键微调 · 编完「导出参数」发我</span>
  <span class="spacer"></span>
  <button id="btnReset">恢复默认</button>
  <button id="btnExport" class="primary">导出参数</button>
</header>

<main>
  <section class="stage">
    <div class="stage-bar">
      <label>窗口 <input id="inW" type="number" step="1"> × <input id="inH" type="number" step="1"> GUI 单位</label>
      <label><input id="inSnap" type="checkbox" checked> 吸附对齐</label>
      <label><input id="inGrid" type="checkbox"> 网格</label>
      <span class="spacer"></span>
      <span id="infoSel">未选中控件</span>
    </div>
    <div class="stage-view" id="stageView"><canvas id="cv"></canvas></div>
  </section>

  <aside class="side">
    <div class="group">
      <h3>控件库（点一下加到画布）</h3>
      <div class="group-body"><div class="palette" id="palette"></div></div>
    </div>
    <div class="group">
      <h3>控件列表（上层在前）</h3>
      <div class="group-body"><div class="wlist" id="list"></div></div>
    </div>
    <div class="group">
      <h3>属性</h3>
      <div class="group-body" id="props"></div>
    </div>
  </aside>
</main>

<div class="modal" id="modal">
  <div class="modal-box">
    <header>
      <h1>导出的布局参数</h1>
      <span class="spacer" style="flex:1"></span>
      <span class="sub">直接发我即可</span>
    </header>
    <textarea id="exportText" readonly spellcheck="false"></textarea>
    <footer>
      <button id="btnCopy">复制到剪贴板</button>
      <button id="btnCloseModal" class="primary">关闭</button>
    </footer>
  </div>
</div>

<script>
"use strict";

/* =====================================================================
   0. 全局参数
   —— 默认值对齐当前 Java 实现（IGui 的 DRIVING_HUD_* / MTR DrivingGuiRenderer）
   ===================================================================== */

const DEFAULT_G = {
  guiWidth: 854, guiHeight: 480,
  edgePadding: 16,   /* MTR DrivingGuiRenderer.EDGE_PADDING */
  toolSize: 96,      /* MTR DrivingGuiRenderer.TOOL_SIZE */
  padding: 4,        /* MTR DrivingGuiRenderer.PADDING */
  lineHeight: 14,
  panelBg: "#111111", panelBorder: "#666666",
  labelColor: "#aaaaaa", textColor: "#ffffff",
  accentColor: "#00e676", warnColor: "#ffb300",
};

let G = Object.assign({}, DEFAULT_G);

/* 控件类型库。kind=panel 是纯背景矩形；kind=row 是「左标签 + 右数值」一行。 */
const TYPES = {
  panel:        { name: "背景面板",   kind: "panel", w: 112, h: 50 },
  departure:    { name: "发车倒计时", kind: "row", w: 104, h: 14, label: "发车",   value: "00:12",     valueColor: "accent" },
  next_station: { name: "下一站",     kind: "row", w: 104, h: 14, label: "下一站", value: "中央车站",  valueColor: "text" },
  reverser:     { name: "反相器",     kind: "row", w: 104, h: 14, label: "反相器", value: "前进位",    valueColor: "text" },
  mode:         { name: "驾驶模式",   kind: "row", w: 104, h: 14, label: "模式",   value: "FAM 全自动", valueColor: "text" },
  speed:        { name: "速度",       kind: "row", w: 104, h: 14, label: "速度",   value: "60 km/h",   valueColor: "text" },
  route:        { name: "车次 / 线路", kind: "row", w: 104, h: 14, label: "车次",  value: "1号线 001", valueColor: "text" },
  text:         { name: "自定义文本", kind: "row", w: 104, h: 14, label: "标签",   value: "内容",      valueColor: "text" },
};

let widgets = [];
let selId = null;
let nextId = 1;
let snapOn = true, gridOn = false;
let guides = [];
let drag = null;
let viewScale = 1;

const SNAP_SCREEN_PX = 6;

/* =====================================================================
   1. 控件模型
   ===================================================================== */

function resolveColor(key) {
  if (key === "accent") return G.accentColor;
  if (key === "warn") return G.warnColor;
  return G.textColor;
}

function mk(type, over) {
  const t = TYPES[type];
  return Object.assign({
    id: nextId++,
    type,
    label: t.label || t.name,
    value: t.value || "",
    x: 0, y: 0,
    w: t.w, h: t.h,
    align: "right",
    box: t.kind === "panel",
    bg: G.panelBg,
    border: G.panelBorder,
    labelColor: G.labelColor,
    valueColor: resolveColor(t.valueColor || "text"),
  }, over || {});
}

/** 默认布局 = 当前 Java 实现：一块面板贴在 MTR 表盘左侧、与表盘竖直居中，里面三行。 */
function defaultLayout() {
  const d = dialGeom();
  const pw = 112, ph = G.padding * 2 + 3 * G.lineHeight;
  const px = Math.round(d.left - 4 - pw);
  const py = Math.round(d.cy - ph / 2);
  const iw = pw - G.padding * 2;
  return [
    mk("panel", { x: px, y: py, w: pw, h: ph }),
    mk("departure",    { x: px + G.padding, y: py + G.padding,                    w: iw, h: G.lineHeight }),
    mk("next_station", { x: px + G.padding, y: py + G.padding + G.lineHeight,     w: iw, h: G.lineHeight }),
    mk("reverser",     { x: px + G.padding, y: py + G.padding + 2 * G.lineHeight, w: iw, h: G.lineHeight }),
  ];
}

/* =====================================================================
   2. 几何
   ===================================================================== */

function dialGeom() {
  const right = G.guiWidth - G.edgePadding;
  const bottom = G.guiHeight - G.edgePadding;
  const left = right - G.toolSize;
  const top = bottom - G.toolSize;
  return { left, top, right, bottom, cx: (left + right) / 2, cy: (top + bottom) / 2, r: G.toolSize / 2 };
}

/* =====================================================================
   3. 画布
   ===================================================================== */

const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

function layoutCanvas() {
  const view = document.getElementById("stageView");
  const availW = Math.max(200, view.clientWidth - 36);
  const availH = Math.max(150, view.clientHeight - 36);
  viewScale = Math.min(availW / G.guiWidth, availH / G.guiHeight);
  const dpr = window.devicePixelRatio || 1;
  cv.style.width = Math.round(G.guiWidth * viewScale) + "px";
  cv.style.height = Math.round(G.guiHeight * viewScale) + "px";
  cv.width = Math.round(G.guiWidth * viewScale * dpr);
  cv.height = Math.round(G.guiHeight * viewScale * dpr);
  ctx.setTransform(viewScale * dpr, 0, 0, viewScale * dpr, 0, 0);
  draw();
}

function draw() {
  const W = G.guiWidth, H = G.guiHeight;
  ctx.clearRect(0, 0, W, H);
  drawWorld(W, H);
  if (gridOn) drawGrid(W, H);
  drawDial();
  for (const w of widgets) drawWidget(w);
  if (selId !== null) drawSelection();
  drawGuides();
}

/** 游戏内底景：深色 + 几块「地形」，只为了看清 HUD 压在世界上的对比度。 */
function drawWorld(W, H) {
  ctx.fillStyle = "#1b1d21";
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#20241f";
  ctx.fillRect(0, H * 0.72, W, H * 0.28);
  ctx.fillStyle = "#2a2f2a";
  ctx.fillRect(W * 0.05, H * 0.60, W * 0.12, H * 0.40);
  ctx.fillRect(W * 0.22, H * 0.70, W * 0.10, H * 0.30);
  ctx.fillRect(W * 0.36, H * 0.64, W * 0.09, H * 0.36);
  ctx.fillStyle = "#262a2e";
  ctx.fillRect(W * 0.62, H * 0.10, W * 0.20, H * 0.16);
}

function drawGrid(W, H) {
  ctx.save();
  ctx.strokeStyle = "rgba(255,255,255,.06)";
  ctx.lineWidth = 1;
  for (let x = 0; x <= W; x += 16) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y <= H; y += 16) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  ctx.restore();
}

function drawDial() {
  const d = dialGeom();
  ctx.save();
  ctx.beginPath();
  ctx.arc(d.cx, d.cy, d.r, 0, Math.PI * 2);
  ctx.fillStyle = "#111111";
  ctx.fill();
  ctx.strokeStyle = "#666666";
  ctx.lineWidth = 1;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(d.cx, d.cy, d.r * 0.9, 0, Math.PI * 2);
  ctx.setLineDash([2, 8]);
  ctx.strokeStyle = "#4a4a4a";
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.beginPath();
  ctx.moveTo(d.cx, d.cy);
  ctx.lineTo(d.cx + d.r * 0.47, d.cy - d.r * 0.65);
  ctx.strokeStyle = G.warnColor;
  ctx.lineWidth = 2.5;
  ctx.lineCap = "round";
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(d.cx, d.cy, d.r * 0.32, 0, Math.PI * 2);
  ctx.fillStyle = "#111111";
  ctx.fill();
  ctx.beginPath();
  ctx.arc(d.cx, d.cy, d.r * 0.24, 0, Math.PI * 2);
  ctx.strokeStyle = "#7a7a7a";
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = "#ffffff";
  ctx.font = "500 20px system-ui,sans-serif";
  ctx.fillText("60", d.cx, d.cy);
  ctx.font = "11px system-ui,sans-serif";
  ctx.fillStyle = "#9aa0a6";
  ctx.fillText("km/h", d.cx, d.cy + d.r * 0.62);
  ctx.restore();
  ctx.textBaseline = "alphabetic";
}

function drawWidget(w) {
  if (w.type === "panel" || w.box) {
    ctx.fillStyle = w.bg;
    ctx.fillRect(w.x, w.y, w.w, w.h);
    ctx.strokeStyle = w.border;
    ctx.lineWidth = 1;
    ctx.strokeRect(w.x + 0.5, w.y + 0.5, Math.max(0, w.w - 1), Math.max(0, w.h - 1));
  }
  if (w.type === "panel") return;

  const ty = w.y + w.h / 2;
  ctx.textBaseline = "middle";
  ctx.font = "12px 'Microsoft YaHei','PingFang SC',system-ui,sans-serif";
  ctx.textAlign = "left";
  ctx.fillStyle = w.labelColor;
  ctx.fillText(w.label, w.x, ty);
  const lw = ctx.measureText(w.label).width;

  ctx.fillStyle = w.valueColor;
  if (w.align === "right") {
    ctx.textAlign = "right";
    ctx.fillText(w.value, w.x + w.w, ty);
  } else if (w.align === "center") {
    ctx.textAlign = "center";
    ctx.fillText(w.value, w.x + w.w / 2, ty);
  } else {
    ctx.textAlign = "left";
    ctx.fillText(w.value, w.x + lw + 6, ty);
  }
  ctx.textBaseline = "alphabetic";
}

function drawSelection() {
  const w = widgets.find(x => x.id === selId);
  if (!w) return;
  ctx.save();
  ctx.strokeStyle = "#4c9aff";
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 3]);
  ctx.strokeRect(w.x - 1.5, w.y - 1.5, w.w + 3, w.h + 3);
  ctx.setLineDash([]);
  ctx.fillStyle = "#4c9aff";
  ctx.fillRect(w.x + w.w - 3, w.y + w.h - 3, 6, 6);
  ctx.restore();
}

function drawGuides() {
  if (!guides.length) return;
  ctx.save();
  ctx.strokeStyle = "#ff3d9a";
  ctx.lineWidth = 1;
  ctx.setLineDash([3, 3]);
  for (const g of guides) {
    ctx.beginPath();
    if (g.axis === "x") { ctx.moveTo(g.v, 0); ctx.lineTo(g.v, G.guiHeight); }
    else { ctx.moveTo(0, g.v); ctx.lineTo(G.guiWidth, g.v); }
    ctx.stroke();
  }
  ctx.restore();
}

/* =====================================================================
   4. 吸附
   ===================================================================== */

function snapTargets(skipId) {
  const xs = [0, G.guiWidth / 2, G.guiWidth];
  const ys = [0, G.guiHeight / 2, G.guiHeight];
  const d = dialGeom();
  xs.push(d.left, d.cx, d.right);
  ys.push(d.top, d.cy, d.bottom);
  for (const w of widgets) {
    if (w.id === skipId) continue;
    xs.push(w.x, w.x + w.w / 2, w.x + w.w);
    ys.push(w.y, w.y + w.h / 2, w.y + w.h);
  }
  return { xs, ys };
}

function snapPos(x, y, w, h, skipId) {
  if (!snapOn) return { x: Math.round(x), y: Math.round(y), guides: [] };
  const t = snapTargets(skipId);
  const th = SNAP_SCREEN_PX / viewScale;
  const g = [];
  let bx = null, bdx = Infinity, by = null, bdy = Infinity;

  for (const edge of [x, x + w / 2, x + w]) {
    for (const tgt of t.xs) {
      const dd = Math.abs(edge - tgt);
      if (dd < th && dd < bdx) { bdx = dd; bx = { delta: tgt - edge, v: tgt }; }
    }
  }
  for (const edge of [y, y + h / 2, y + h]) {
    for (const tgt of t.ys) {
      const dd = Math.abs(edge - tgt);
      if (dd < th && dd < bdy) { bdy = dd; by = { delta: tgt - edge, v: tgt }; }
    }
  }

  let nx = x, ny = y;
  if (bx) { nx = x + bx.delta; g.push({ axis: "x", v: bx.v }); }
  if (by) { ny = y + by.delta; g.push({ axis: "y", v: by.v }); }
  if (gridOn) { nx = Math.round(nx / 4) * 4; ny = Math.round(ny / 4) * 4; }
  return { x: Math.round(nx), y: Math.round(ny), guides: g };
}

function snapSize(x, y, w, h, skipId) {
  if (!snapOn) return { w: Math.round(w), h: Math.round(h), guides: [] };
  const t = snapTargets(skipId);
  const th = SNAP_SCREEN_PX / viewScale;
  const g = [];
  let bx = null, bdx = Infinity, by = null, bdy = Infinity;

  for (const tgt of t.xs) {
    const dd = Math.abs((x + w) - tgt);
    if (dd < th && dd < bdx) { bdx = dd; bx = tgt; }
  }
  for (const tgt of t.ys) {
    const dd = Math.abs((y + h) - tgt);
    if (dd < th && dd < bdy) { bdy = dd; by = tgt; }
  }

  let nw = w, nh = h;
  if (bx !== null) { nw = bx - x; g.push({ axis: "x", v: bx }); }
  if (by !== null) { nh = by - y; g.push({ axis: "y", v: by }); }
  return { w: Math.round(Math.max(8, nw)), h: Math.round(Math.max(6, nh)), guides: g };
}

/* =====================================================================
   5. 交互
   ===================================================================== */

function toGui(ev) {
  const r = cv.getBoundingClientRect();
  return { x: (ev.clientX - r.left) / viewScale, y: (ev.clientY - r.top) / viewScale };
}

function hitTest(x, y) {
  for (let i = widgets.length - 1; i >= 0; i--) {
    const w = widgets[i];
    if (x >= w.x && x <= w.x + w.w && y >= w.y && y <= w.y + w.h) return w;
  }
  return null;
}

cv.addEventListener("pointerdown", ev => {
  cv.setPointerCapture(ev.pointerId);
  const p = toGui(ev);
  const hit = hitTest(p.x, p.y);
  if (!hit) {
    selId = null;
    guides = [];
    renderUI();
    draw();
    return;
  }
  selId = hit.id;
  const inHandle = p.x >= hit.x + hit.w - 7 && p.y >= hit.y + hit.h - 7;
  drag = { mode: inHandle ? "resize" : "move", id: hit.id, dx: p.x - hit.x, dy: p.y - hit.y };
  renderUI();
  draw();
});

cv.addEventListener("pointermove", ev => {
  const p = toGui(ev);
  if (!drag) {
    const hit = hitTest(p.x, p.y);
    if (!hit) cv.style.cursor = "default";
    else if (p.x >= hit.x + hit.w - 7 && p.y >= hit.y + hit.h - 7) cv.style.cursor = "nwse-resize";
    else cv.style.cursor = "move";
    return;
  }
  const w = widgets.find(x => x.id === drag.id);
  if (!w) return;

  if (drag.mode === "move") {
    const r = snapPos(p.x - drag.dx, p.y - drag.dy, w.w, w.h, w.id);
    w.x = r.x; w.y = r.y; guides = r.guides;
  } else {
    const r = snapSize(w.x, w.y, Math.max(8, p.x - w.x), Math.max(6, p.y - w.y), w.id);
    w.w = r.w; w.h = r.h; guides = r.guides;
  }
  syncNums();
  draw();
});

function endDrag() {
  if (!drag) return;
  drag = null;
  guides = [];
  renderList();
  draw();
}
cv.addEventListener("pointerup", endDrag);
cv.addEventListener("pointercancel", endDrag);

window.addEventListener("keydown", ev => {
  if (ev.target && /input|textarea|select/i.test(ev.target.tagName)) return;
  const w = widgets.find(x => x.id === selId);
  if (!w) return;

  if (ev.key === "Delete" || ev.key === "Backspace") {
    ev.preventDefault();
    removeWidget(w.id);
    return;
  }
  const step = ev.shiftKey ? 10 : 1;
  let moved = false;
  if (ev.key === "ArrowLeft")  { w.x -= step; moved = true; }
  if (ev.key === "ArrowRight") { w.x += step; moved = true; }
  if (ev.key === "ArrowUp")    { w.y -= step; moved = true; }
  if (ev.key === "ArrowDown")  { w.y += step; moved = true; }
  if (moved) {
    ev.preventDefault();
    syncNums();
    draw();
  }
});

/* =====================================================================
   6. 增删改
   ===================================================================== */

function addWidget(type) {
  const d = dialGeom();
  const base = mk(type);
  base.x = Math.round(d.left - 8 - base.w);
  base.y = Math.round(d.cy - base.h / 2);
  widgets.push(base);
  selId = base.id;
  renderUI();
  draw();
}

function removeWidget(id) {
  widgets = widgets.filter(w => w.id !== id);
  if (selId === id) selId = null;
  renderUI();
  draw();
}

function moveZ(id, dir) {
  const i = widgets.findIndex(w => w.id === id);
  if (i < 0) return;
  const j = i + dir;
  if (j < 0 || j >= widgets.length) return;
  const tmp = widgets[i];
  widgets[i] = widgets[j];
  widgets[j] = tmp;
  renderUI();
  draw();
}

/* =====================================================================
   7. 右侧面板
   ===================================================================== */

function renderUI() {
  renderList();
  renderProps();
  const w = widgets.find(x => x.id === selId);
  document.getElementById("infoSel").textContent = w
    ? ("已选中：" + TYPES[w.type].name + "  x=" + Math.round(w.x) + " y=" + Math.round(w.y) + "  " + Math.round(w.w) + "×" + Math.round(w.h))
    : "未选中控件";
}

function renderPalette() {
  const el = document.getElementById("palette");
  el.innerHTML = "";
  for (const key of Object.keys(TYPES)) {
    const b = document.createElement("button");
    b.textContent = TYPES[key].name;
    b.onclick = () => addWidget(key);
    el.appendChild(b);
  }
}

function renderList() {
  const el = document.getElementById("list");
  el.innerHTML = "";
  if (!widgets.length) {
    el.innerHTML = '<div class="hint">画布是空的。从上面的控件库点一个加上去。</div>';
    return;
  }
  for (let i = widgets.length - 1; i >= 0; i--) {
    const w = widgets[i];
    const row = document.createElement("div");
    row.className = "wrow" + (w.id === selId ? " sel" : "");

    const nm = document.createElement("span");
    nm.className = "nm";
    nm.textContent = TYPES[w.type].name + (w.type === "panel" ? "" : " · " + w.label);
    row.appendChild(nm);

    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = Math.round(w.w) + "×" + Math.round(w.h);
    row.appendChild(tag);

    row.appendChild(iconBtn("\u2191", "上移一层", ev => { ev.stopPropagation(); moveZ(w.id, +1); }));
    row.appendChild(iconBtn("\u2193", "下移一层", ev => { ev.stopPropagation(); moveZ(w.id, -1); }));
    row.appendChild(iconBtn("\u2715", "删除", ev => { ev.stopPropagation(); removeWidget(w.id); }, "del"));

    row.onclick = () => { selId = w.id; renderUI(); draw(); };
    el.appendChild(row);
  }
}

function iconBtn(text, title, onclick, extraClass) {
  const b = document.createElement("button");
  b.textContent = text;
  b.title = title;
  if (extraClass) b.className = extraClass;
  b.onclick = onclick;
  return b;
}

let numRefs = null;

function syncNums() {
  if (!numRefs) return;
  const w = widgets.find(x => x.id === selId);
  if (!w) return;
  numRefs.x.value = Math.round(w.x);
  numRefs.y.value = Math.round(w.y);
  numRefs.w.value = Math.round(w.w);
  numRefs.h.value = Math.round(w.h);
  document.getElementById("infoSel").textContent =
    "已选中：" + TYPES[w.type].name + "  x=" + Math.round(w.x) + " y=" + Math.round(w.y) +
    "  " + Math.round(w.w) + "×" + Math.round(w.h);
}

function renderProps() {
  const el = document.getElementById("props");
  el.innerHTML = "";
  numRefs = null;
  const w = widgets.find(x => x.id === selId);
  if (!w) {
    el.innerHTML = '<div class="hint">在画布上点一个控件来编辑，或从上面的控件库新增。<br>拖动 = 移动 · 右下角小方块 = 改大小 · Delete = 删除 · 方向键 = 微调（Shift 加速）</div>';
    return;
  }

  const isPanel = w.type === "panel";

  if (!isPanel) {
    el.appendChild(ctrlRow("标签", textInput(w.label, v => { w.label = v; renderList(); draw(); })));
    el.appendChild(ctrlRow("显示值", textInput(w.value, v => { w.value = v; draw(); })));
    const sel = document.createElement("select");
    for (const [k, n] of [["left", "紧跟标签"], ["center", "居中"], ["right", "右对齐"]]) {
      const o = document.createElement("option");
      o.value = k; o.textContent = n;
      if (w.align === k) o.selected = true;
      sel.appendChild(o);
    }
    sel.onchange = () => { w.align = sel.value; draw(); };
    el.appendChild(ctrlRow("数值对齐", sel));
  }

  const xy = document.createElement("div");
  xy.className = "kv";
  const xi = numInput(w.x, v => { w.x = v; draw(); });
  const yi = numInput(w.y, v => { w.y = v; draw(); });
  xy.appendChild(kvItem("X", xi));
  xy.appendChild(kvItem("Y", yi));
  el.appendChild(ctrlRow("位置", xy));

  const wh = document.createElement("div");
  wh.className = "kv";
  const wi = numInput(w.w, v => { w.w = Math.max(8, v); draw(); });
  const hi = numInput(w.h, v => { w.h = Math.max(6, v); draw(); });
  wh.appendChild(kvItem("宽", wi));
  wh.appendChild(kvItem("高", hi));
  el.appendChild(ctrlRow("大小", wh));

  numRefs = { x: xi, y: yi, w: wi, h: hi };

  el.appendChild(ctrlRow("画背景", checkInput(w.box, v => { w.box = v; draw(); })));
  el.appendChild(ctrlRow("底色", colorInput(w.bg, v => { w.bg = v; draw(); })));
  el.appendChild(ctrlRow("描边", colorInput(w.border, v => { w.border = v; draw(); })));

  if (!isPanel) {
    el.appendChild(ctrlRow("标签色", colorInput(w.labelColor, v => { w.labelColor = v; draw(); })));
    el.appendChild(ctrlRow("数值色", colorInput(w.valueColor, v => { w.valueColor = v; draw(); })));
  }

  const btns = document.createElement("div");
  btns.className = "btns";
  const dup = document.createElement("button");
  dup.textContent = "复制一份";
  dup.onclick = () => {
    const c = Object.assign({}, w, { id: nextId++, x: w.x + 8, y: w.y + 8 });
    widgets.push(c);
    selId = c.id;
    renderUI();
    draw();
  };
  const del = document.createElement("button");
  del.className = "danger";
  del.textContent = "删除控件";
  del.onclick = () => removeWidget(w.id);
  btns.appendChild(dup);
  btns.appendChild(del);
  el.appendChild(btns);
}

function ctrlRow(name, node) {
  const c = document.createElement("div");
  c.className = "ctrl";
  const l = document.createElement("span");
  l.className = "ctrl-name";
  l.textContent = name;
  c.appendChild(l);
  c.appendChild(node);
  return c;
}

function kvItem(name, node) {
  const d = document.createElement("div");
  const s = document.createElement("span");
  s.textContent = name;
  d.appendChild(s);
  d.appendChild(node);
  return d;
}

function numInput(val, on) {
  const i = document.createElement("input");
  i.type = "number";
  i.step = "1";
  i.value = Math.round(val);
  i.oninput = () => on(parseFloat(i.value) || 0);
  return i;
}

function textInput(val, on) {
  const i = document.createElement("input");
  i.type = "text";
  i.value = val;
  i.oninput = () => on(i.value);
  return i;
}

function colorInput(val, on) {
  const i = document.createElement("input");
  i.type = "color";
  i.value = val;
  i.oninput = () => on(i.value);
  return i;
}

function checkInput(val, on) {
  const i = document.createElement("input");
  i.type = "checkbox";
  i.checked = !!val;
  i.onchange = () => on(i.checked);
  return i;
}

/* =====================================================================
   8. 导出
   ===================================================================== */

function hexOf(c) {
  return c.replace("#", "").toUpperCase();
}

function exportText() {
  const W = G.guiWidth, H = G.guiHeight;
  const L = [];
  L.push("// ===== 手动驾驶 HUD · 由 design/driving-hud-editor.html 导出 =====");
  L.push("// 基准窗口 " + W + " × " + H + " GUI 单位");
  L.push("// 坐标以屏幕【右下角】为原点：rightInset = 距右边缘，bottomInset = 距下边缘，");
  L.push("// 指向控件的【右下角】。Java 侧： right = width - rightInset; bottom = height - bottomInset;");
  L.push("");
  L.push("// ---- 全局 ----");
  L.push("int DRIVING_HUD_EDGE_PADDING = " + G.edgePadding + ";      // MTR EDGE_PADDING");
  L.push("int DRIVING_HUD_SPEEDOMETER_SIZE = " + G.toolSize + ";   // MTR TOOL_SIZE");
  L.push("int DRIVING_HUD_PADDING = " + G.padding + ";");
  L.push("int LINE_HEIGHT = " + G.lineHeight + ";");
  L.push("int ARGB_HUD_BACKGROUND = 0xFF" + hexOf(G.panelBg) + ";");
  L.push("int ARGB_HUD_BORDER = 0xFF" + hexOf(G.panelBorder) + ";");
  L.push("int ARGB_HUD_LABEL = 0xFF" + hexOf(G.labelColor) + ";");
  L.push("int ARGB_HUD_TEXT = 0xFF" + hexOf(G.textColor) + ";");
  L.push("int ARGB_HUD_ACCENT = 0xFF" + hexOf(G.accentColor) + ";");
  L.push("int ARGB_HUD_WARN = 0xFF" + hexOf(G.warnColor) + ";");
  L.push("");
  L.push("// ---- 控件（按绘制顺序，先画的在下层）----");
  widgets.forEach((w, i) => {
    const ri = Math.round(W - (w.x + w.w));
    const bi = Math.round(H - (w.y + w.h));
    L.push("// [" + i + "] " + TYPES[w.type].name
      + "  rightInset=" + ri + " bottomInset=" + bi
      + "  w=" + Math.round(w.w) + " h=" + Math.round(w.h)
      + (w.type === "panel" ? "" : "  label=\"" + w.label + "\" value=\"" + w.value + "\""));
  });
  L.push("");
  L.push("// ---- JSON（机器可读，直接发我即可）----");
  L.push(JSON.stringify({
    guiWidth: W,
    guiHeight: H,
    global: {
      edgePadding: G.edgePadding,
      toolSize: G.toolSize,
      padding: G.padding,
      lineHeight: G.lineHeight,
      panelBg: G.panelBg,
      panelBorder: G.panelBorder,
      labelColor: G.labelColor,
      textColor: G.textColor,
      accentColor: G.accentColor,
      warnColor: G.warnColor,
    },
    widgets: widgets.map(w => ({
      type: w.type,
      label: w.label,
      value: w.value,
      rightInset: Math.round(W - (w.x + w.w)),
      bottomInset: Math.round(H - (w.y + w.h)),
      w: Math.round(w.w),
      h: Math.round(w.h),
      align: w.align,
      box: w.box,
      bg: w.bg,
      border: w.border,
      labelColor: w.labelColor,
      valueColor: w.valueColor,
    })),
  }, null, 2));
  return L.join("\n");
}

/* =====================================================================
   9. 启动
   ===================================================================== */

function bindUI() {
  const inW = document.getElementById("inW");
  const inH = document.getElementById("inH");
  inW.value = G.guiWidth;
  inH.value = G.guiHeight;
  inW.onchange = () => { G.guiWidth = Math.max(160, parseInt(inW.value) || 854); layoutCanvas(); };
  inH.onchange = () => { G.guiHeight = Math.max(120, parseInt(inH.value) || 480); layoutCanvas(); };

  const inSnap = document.getElementById("inSnap");
  const inGrid = document.getElementById("inGrid");
  inSnap.onchange = () => { snapOn = inSnap.checked; };
  inGrid.onchange = () => { gridOn = inGrid.checked; draw(); };

  document.getElementById("btnReset").onclick = () => {
    G = Object.assign({}, DEFAULT_G);
    nextId = 1;
    widgets = defaultLayout();
    selId = null;
    inW.value = G.guiWidth;
    inH.value = G.guiHeight;
    renderUI();
    layoutCanvas();
  };

  const modal = document.getElementById("modal");
  document.getElementById("btnExport").onclick = () => {
    document.getElementById("exportText").value = exportText();
    modal.classList.add("show");
  };
  document.getElementById("btnCloseModal").onclick = () => modal.classList.remove("show");
  document.getElementById("btnCopy").onclick = () => {
    const t = document.getElementById("exportText");
    t.select();
    try { document.execCommand("copy"); } catch (e) { /* 忽略 */ }
    document.getElementById("btnCopy").textContent = "已复制";
    setTimeout(() => { document.getElementById("btnCopy").textContent = "复制到剪贴板"; }, 1200);
  };

  for (const h of document.querySelectorAll(".group>h3")) {
    h.onclick = () => h.parentElement.classList.toggle("collapsed");
  }
}

function boot() {
  widgets = defaultLayout();
  bindUI();
  renderPalette();
  renderUI();
  layoutCanvas();
  window.addEventListener("resize", layoutCanvas);
}

boot();
</script>
