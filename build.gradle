plugins {
	id "fabric-loom" version "1.10-SNAPSHOT"
}

group "org.mtr.signal.dashboard"
version "${version}+${minecraftVersion}"

base {
	archivesName = "Mewzica-s-MTR-Addon-fabric"
}

repositories {
	flatDir { dirs "libs" }
	maven { url = "https://maven.fabricmc.net/" }
	maven { url = "https://api.modrinth.com/maven/" }
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraftVersion}"
	mappings "net.fabricmc:yarn:${yarnVersion}:v2"
	modImplementation "net.fabricmc:fabric-loader:${fabricLoaderVersion}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"

	// MTR 本体作为编译与运行依赖
	modImplementation files(mtrJar)

	// MTR 的字节码里用到了 JSR305 的 @ParametersAreNonnullByDefault 等注解，
	// 但发布版 jar 没有把这个注解库打进去。编译期需要它，否则 javac 会报
	// "程序包 javax.annotation 不存在"。
	compileOnly "com.google.code.findbugs:jsr305:3.0.2"
}

java {
	toolchain {
		languageVersion.set(JavaLanguageVersion.of(17))
	}
	withSourcesJar()
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft", minecraftVersion

	filesMatching("fabric.mod.json") {
		expand "version": project.version, "minecraft": minecraftVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 17
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}
